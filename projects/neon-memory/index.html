<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Memory Matrix</title>
  <style>
    :root { color-scheme: dark; --bg: #070711; --panel: #111127; --ink: #f5f3ff; --muted: #aaa4c5; --cyan: #22d3ee; --violet: #a78bfa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: var(--ink); background: radial-gradient(circle at 50% 0, #24145c, var(--bg) 58%); font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(680px, 100%); padding: clamp(20px, 5vw, 42px); border: 1px solid #5b4ab3; border-radius: 24px; background: #0e0e20e8; box-shadow: 0 0 70px #6d28d933; }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 4rem); line-height: 1; letter-spacing: -.06em; text-shadow: 0 0 24px #a78bfa99; }
    .eyebrow { color: var(--cyan); font: 700 .75rem monospace; letter-spacing: .2em; text-transform: uppercase; }
    .intro, .status { color: var(--muted); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 24px 0; }
    button { border: 1px solid #6d5bd0; border-radius: 10px; padding: 10px 14px; color: var(--ink); background: #1b1740; font: inherit; cursor: pointer; }
    button:hover, button:focus-visible { border-color: var(--cyan); outline: 3px solid #22d3ee55; outline-offset: 2px; }
    .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; perspective: 900px; }
    .card { min-height: 100px; padding: 0; border: 0; background: transparent; }
    .card-inner { display: grid; min-height: 100px; place-items: center; border: 1px solid #5b4ab3; border-radius: 14px; background: #18183a; font-size: 2rem; transform-style: preserve-3d; transition: transform .45s ease, box-shadow .2s ease; }
    .card:hover .card-inner, .card:focus-visible .card-inner { box-shadow: 0 0 20px #22d3ee66; }
    .card[aria-pressed="true"] .card-inner, .card.matched .card-inner { transform: rotateY(180deg); background: #142d3c; }
    .front, .back { grid-area: 1 / 1; backface-visibility: hidden; }
    .back { transform: rotateY(180deg); }
    .card.matched .card-inner { border-color: var(--cyan); box-shadow: 0 0 18px #22d3ee66; }
    @media (max-width: 480px) { .board { gap: 8px; } .card, .card-inner { min-height: 74px; } }
    @media (prefers-reduced-motion: reduce) { .card-inner { transition: none; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Project 02 / browser game</p>
    <h1>Neon Memory Matrix</h1>
    <p class="intro">Find every matching pair before the matrix overloads. Keyboard-friendly, dependency-free, and built for a quick replay.</p>
    <div class="toolbar">
      <button id="restart" type="button">Restart <kbd>R</kbd></button>
      <span class="status" id="status" role="status" aria-live="polite"></span>
    </div>
    <section class="board" id="board" aria-label="Memory card board"></section>
  </main>
  <script>
    const symbols = ["◆", "◇", "✦", "✧", "⬡", "⬢", "◈", "◉"];
    const board = document.querySelector("#board");
    const status = document.querySelector("#status");
    let first = null, second = null, locked = false, moves = 0, matched = 0;

    function shuffle(items) {
      return [...items].sort(() => Math.random() - 0.5);
    }

    function updateStatus(message = "") {
      status.textContent = message || `${moves} moves · ${matched / 2} of ${symbols.length} pairs`;
    }

    function flip(card) {
      if (locked || card === first || card.classList.contains("matched")) return;
      card.setAttribute("aria-pressed", "true");
      if (!first) { first = card; return; }
      second = card;
      moves++;
      locked = true;
      const isMatch = first.dataset.symbol === second.dataset.symbol;
      if (isMatch) {
        first.classList.add("matched");
        second.classList.add("matched");
        matched += 2;
        resetTurn();
        updateStatus(matched === symbols.length * 2 ? `Matrix cleared in ${moves} moves!` : "");
      } else {
        setTimeout(() => {
          first.setAttribute("aria-pressed", "false");
          second.setAttribute("aria-pressed", "false");
          resetTurn();
          updateStatus();
        }, 700);
      }
    }

    function resetTurn() { first = null; second = null; locked = false; }

    function start() {
      board.innerHTML = "";
      resetTurn();
      moves = 0;
      matched = 0;
      shuffle([...symbols, ...symbols]).forEach((symbol, index) => {
        const card = document.createElement("button");
        card.className = "card";
        card.type = "button";
        card.dataset.symbol = symbol;
        card.setAttribute("aria-label", `Hidden card ${index + 1}`);
        card.setAttribute("aria-pressed", "false");
        card.innerHTML = `<span class="card-inner"><span class="front" aria-hidden="true">?</span><span class="back" aria-hidden="true">${symbol}</span></span>`;
        card.addEventListener("click", () => flip(card));
        board.append(card);
      });
      updateStatus();
    }

    document.querySelector("#restart").addEventListener("click", start);
    document.addEventListener("keydown", event => { if (event.key.toLowerCase() === "r" && event.target.tagName !== "BUTTON") start(); });
    start();
  </script>
</body>
</html>
