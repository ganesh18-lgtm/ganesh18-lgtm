<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 34" role="img" aria-label="Animated cyan and violet data flow divider">
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <path d="M0 17H1200" stroke="#334155" stroke-width="1"/>
  <path d="M0 17H1200" stroke="url(#line)" stroke-width="2" stroke-dasharray="1 70" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-142;0" dur="4s" repeatCount="indefinite"/>
  </path>
  <circle cx="160" cy="17" r="3" fill="#22d3ee" filter="url(#glow)">
    <animate attributeName="cx" values="160;1040;160" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="17" r="2" fill="#a78bfa" filter="url(#glow)">
    <animate attributeName="cx" values="1040;160;1040" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
