<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" role="img" aria-labelledby="title desc">
  <title id="title">Developer Mission Control</title>
  <desc id="desc">Animated dashboard showing current development focus areas.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#161b26"/>
      <stop offset="1" stop-color="#0b0e16"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="558" height="188" rx="14" fill="url(#panel)" stroke="#7c3aed"/>
  <path d="M20 42h520M20 166h520" stroke="#283044"/>
  <text x="22" y="28" fill="#c4b5fd" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1.5">DEVELOPER MISSION CONTROL</text>
  <circle cx="514" cy="23" r="4" fill="#22c55e" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="532" y="27" fill="#86efac" font-family="monospace" font-size="8" text-anchor="end">ONLINE</text>
  <g transform="translate(72 101)">
    <circle r="42" fill="none" stroke="#26334b" stroke-width="2"/>
    <circle r="29" fill="none" stroke="#26334b"/>
    <path d="M0-42A42 42 0 0 1 33 26" fill="none" stroke="url(#cyan)" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M0-29A29 29 0 0 1 22 18" fill="none" stroke="#a78bfa" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="3s" repeatCount="indefinite"/>
    </path>
    <circle r="5" fill="#22d3ee" filter="url(#glow)"/>
    <text y="3" fill="#fff" font-family="monospace" font-size="8" text-anchor="middle">BUILD</text>
  </g>
  <g font-family="monospace">
    <text x="138" y="67" fill="#94a3b8" font-size="8">CURRENT FLIGHT PLAN</text>
    <text x="138" y="88" fill="#f8fafc" font-size="13" font-weight="700">ShelfLife AI</text>
    <text x="138" y="106" fill="#94a3b8" font-size="9">Kotlin · Compose · Gemini · Vision</text>
    <rect x="138" y="121" width="260" height="7" rx="4" fill="#20283a"/>
    <rect x="138" y="121" width="198" height="7" rx="4" fill="url(#cyan)">
      <animate attributeName="width" values="176;214;176" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="138" y="148" fill="#22d3ee" font-size="9">SYSTEMS ONLINE</text>
    <text x="138" y="160" fill="#c4b5fd" font-size="8">ANDROID</text>
    <text x="215" y="160" fill="#c4b5fd" font-size="8">AI / CV</text>
    <text x="278" y="160" fill="#c4b5fd" font-size="8">WEB</text>
    <text x="330" y="160" fill="#c4b5fd" font-size="8">SECURITY</text>
  </g>
  <g fill="#22d3ee">
    <circle cx="478" cy="77" r="3"><animate attributeName="cy" values="77;69;77" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="508" cy="108" r="3"><animate attributeName="cy" values="108;118;108" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="468" cy="143" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>
