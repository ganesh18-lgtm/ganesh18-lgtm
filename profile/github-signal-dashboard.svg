<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Signal Dashboard</title>
  <desc id="desc">Animated GitHub analytics dashboard showing language telemetry percentages and contribution activity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#0b1120"/>
      <stop offset=".55" stop-color="#12152b"/>
      <stop offset="1" stop-color="#071d2b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" x2="1">
      <stop stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#64748b" stroke-opacity=".08"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="1098" height="400" rx="18" fill="url(#bg)" stroke="#334155"/>
  <rect x="1" y="1" width="1098" height="400" rx="18" fill="url(#grid)"/>
  <text x="34" y="38" fill="#67e8f9" font-family="monospace" font-size="12" font-weight="700" letter-spacing="3">GITHUB SIGNAL DASHBOARD</text>
  <circle cx="1030" cy="31" r="5" fill="#22c55e" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.25;1" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  <text x="1058" y="35" text-anchor="end" fill="#86efac" font-family="monospace" font-size="10">LIVE TELEMETRY</text>
  <g transform="translate(30 62)">
    <rect width="505" height="298" rx="12" fill="#080d18" fill-opacity=".72" stroke="#26334b"/>
    <text x="24" y="31" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Language telemetry</text>
    <text x="24" y="52" fill="#94a3b8" font-family="monospace" font-size="10">REPOSITORY SIGNAL · LANGUAGE COVERAGE</text>
    <g font-family="monospace" font-size="12">
      <text x="24" y="88" fill="#f8fafc">JavaScript</text><text x="24" y="124" fill="#f8fafc">TypeScript</text><text x="24" y="160" fill="#f8fafc">Kotlin</text><text x="24" y="196" fill="#f8fafc">Python</text><text x="24" y="232" fill="#f8fafc">Java</text><text x="24" y="268" fill="#f8fafc">HTML / CSS</text>
      <rect x="130" y="77" width="300" height="12" rx="6" fill="#1e293b"/><rect x="130" y="77" width="276" height="12" rx="6" fill="url(#cyan)"><animate attributeName="width" values="258;294;258" dur="4s" repeatCount="indefinite"/></rect><text x="442" y="88" fill="#67e8f9">92%</text>
      <rect x="130" y="113" width="300" height="12" rx="6" fill="#1e293b"/><rect x="130" y="113" width="264" height="12" rx="6" fill="url(#violet)"><animate attributeName="width" values="246;282;246" dur="3.5s" repeatCount="indefinite"/></rect><text x="442" y="124" fill="#c4b5fd">88%</text>
      <rect x="130" y="149" width="300" height="12" rx="6" fill="#1e293b"/><rect x="130" y="149" width="252" height="12" rx="6" fill="#38bdf8"><animate attributeName="width" values="234;270;234" dur="4.5s" repeatCount="indefinite"/></rect><text x="442" y="160" fill="#67e8f9">84%</text>
      <rect x="130" y="185" width="300" height="12" rx="6" fill="#1e293b"/><rect x="130" y="185" width="243" height="12" rx="6" fill="#a78bfa"><animate attributeName="width" values="225;261;225" dur="3.8s" repeatCount="indefinite"/></rect><text x="442" y="196" fill="#c4b5fd">81%</text>
      <rect x="130" y="221" width="300" height="12" rx="6" fill="#1e293b"/><rect x="130" y="221" width="234" height="12" rx="6" fill="#22d3ee"><animate attributeName="width" values="216;252;216" dur="4.2s" repeatCount="indefinite"/></rect><text x="442" y="232" fill="#67e8f9">78%</text>
      <rect x="130" y="257" width="300" height="12" rx="6" fill="#1e293b"/><rect x="130" y="257" width="228" height="12" rx="6" fill="#818cf8"><animate attributeName="width" values="210;246;210" dur="4.8s" repeatCount="indefinite"/></rect><text x="442" y="268" fill="#a5b4fc">76%</text>
    </g>
  </g>
  <g transform="translate(565 62)">
    <rect width="505" height="298" rx="12" fill="#080d18" fill-opacity=".72" stroke="#26334b"/>
    <text x="24" y="31" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Activity pulse</text>
    <text x="24" y="52" fill="#94a3b8" font-family="monospace" font-size="10">CONTRIBUTION FLOW · BUILD VELOCITY</text>
    <path d="M26 177H478M26 134H478M26 91H478" stroke="#26334b"/>
    <path d="M26 177L80 158L123 166L166 111L210 132L253 92L298 122L344 80L388 105L432 64L478 88" fill="none" stroke="url(#cyan)" stroke-width="3" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="1 1000;1000 1" dur="3s" repeatCount="indefinite"/>
    </path>
    <g fill="#67e8f9" filter="url(#glow)">
      <circle cx="80" cy="158" r="4"><animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="253" cy="92" r="4"><animate attributeName="r" values="3;6;3" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="432" cy="64" r="4"><animate attributeName="r" values="3;6;3" dur="1.8s" repeatCount="indefinite"/></circle>
    </g>
    <text x="26" y="275" fill="#22d3ee" font-family="monospace" font-size="11">BUILD</text>
    <text x="154" y="275" fill="#a78bfa" font-family="monospace" font-size="11">LEARN</text>
    <text x="291" y="275" fill="#67e8f9" font-family="monospace" font-size="11">SHIP</text>
    <text x="420" y="275" fill="#c4b5fd" font-family="monospace" font-size="11">REPEAT</text>
  </g>
</svg>
