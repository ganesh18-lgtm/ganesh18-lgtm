<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ganesh B C — developer profile</title>
  <desc id="desc">Animated modern technology header with flowing data lines and a glowing developer title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080b14"/>
      <stop offset=".55" stop-color="#11152a"/>
      <stop offset="1" stop-color="#071d2b"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="0" x2="1">
      <stop stop-color="#f8fafc"/>
      <stop offset=".45" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#67e8f9"/>
      <animate attributeName="x1" values="0;1;0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" x2="1">
      <stop stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#64748b" stroke-opacity=".1"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <ellipse cx="600" cy="155" rx="300" ry="115" fill="#4f46e5" opacity=".12" filter="url(#glow)">
    <animate attributeName="rx" values="300;340;300" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".08;.18;.08" dur="6s" repeatCount="indefinite"/>
  </ellipse>
  <g fill="none" stroke="url(#flow)" stroke-width="2">
    <path d="M-40 270C170 90 300 330 520 170S870 20 1240 180">
      <animate attributeName="stroke-dasharray" values="1 34;34 1;1 34" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;-140;-280" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M-40 305C170 125 310 350 530 205S900 65 1240 220" opacity=".6">
      <animate attributeName="stroke-dasharray" values="1 48;48 1;1 48" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;-190;-380" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M-40 88C220 215 370 10 610 125S920 285 1240 82" opacity=".45">
      <animate attributeName="stroke-dasharray" values="1 56;56 1;1 56" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;-220;-440" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#67e8f9" filter="url(#softGlow)">
    <circle cx="158" cy="205" r="3"><animate attributeName="cy" values="205;192;205" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="142" r="3"><animate attributeName="cy" values="142;155;142" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="270" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="106" fill="#67e8f9" font-size="12" font-weight="700" letter-spacing="5">GANESH B C / DIGITAL BUILDER</text>
    <text x="600" y="181" fill="none" stroke="#22d3ee" stroke-opacity=".35" stroke-width="2" font-size="76" font-weight="800" letter-spacing="7" filter="url(#glow)">GANESH B C
      <animate attributeName="stroke-opacity" values=".18;.65;.18" dur="2.8s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="181" fill="url(#titleGradient)" font-size="76" font-weight="800" letter-spacing="7">GANESH B C
      <animate attributeName="opacity" values=".82;1;.82" dur="2.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="2.8s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="220" fill="#cbd5e1" font-size="19" font-weight="500" letter-spacing="2">CS ENGINEER · DEVELOPER · CYBERSECURITY ENTHUSIAST
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.28;.72;1" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="-90 0;0 0;0 0;90 0" keyTimes="0;.28;.72;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="270" fill="#94a3b8" font-family="monospace" font-size="12" letter-spacing="3">
      BUILDING INTELLIGENT SYSTEMS
      <animate attributeName="opacity" values=".45;1;.45" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="18" fill="none" stroke="#334155"/>
  <path d="M36 320H260M940 320h224" stroke="#22d3ee" stroke-opacity=".7"/>
  <circle cx="280" cy="320" r="3" fill="#22d3ee"><animate attributeName="cx" values="280;920;280" dur="7s" repeatCount="indefinite"/></circle>
</svg>
