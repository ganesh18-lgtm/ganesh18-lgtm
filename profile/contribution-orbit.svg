<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">Contribution Orbit</title>
  <desc id="desc">An animated constellation of contribution nodes orbiting a glowing central GitHub mark.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <linearGradient id="line" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <path d="M0 210 Q225 160 450 210 T900 210" fill="none" stroke="url(#line)" stroke-width="1"/>
  <path d="M0 70 Q225 120 450 70 T900 70" fill="none" stroke="url(#line)" stroke-width="1"/>
  <g transform="translate(450 130)" fill="none" stroke="#8b5cf6" stroke-opacity=".35">
    <ellipse rx="330" ry="78" stroke-width="1.5"/>
    <ellipse rx="235" ry="54" stroke-width="1"/>
    <ellipse rx="135" ry="30" stroke-width="1"/>
  </g>
  <g transform="translate(450 130)" filter="url(#glow)">
    <circle r="25" fill="#7c3aed" opacity=".3">
      <animate attributeName="r" values="25;38;25" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".3;0;.3" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="16" fill="#a78bfa"/>
    <path d="M-8-1c0-6 4-10 10-10 5 0 9 3 10 8 5 0 8 3 8 8 0 5-4 8-9 8H-9c-6 0-10-4-10-9 0-4 3-8 7-9 0-1 0-2 0-3Z" fill="#fff"/>
  </g>
  <g fill="#22d3ee" filter="url(#glow)">
    <circle cx="120" cy="130" r="4"><animate attributeName="cy" values="130;116;130" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="78" r="5"><animate attributeName="cy" values="78;66;78" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="178" r="4"><animate attributeName="cy" values="178;166;178" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="82" r="5"><animate attributeName="cy" values="82;70;82" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="138" r="4"><animate attributeName="cy" values="138;124;138" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="180" r="4"><animate attributeName="cy" values="180;166;180" dur="2.3s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#a78bfa" filter="url(#glow)">
    <circle cx="70" cy="68" r="3"><animate attributeName="opacity" values=".3;1;.3" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="64" r="3"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="550" cy="196" r="3"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="60" r="3"><animate attributeName="opacity" values="1;.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>
  <text x="450" y="232" fill="#c4b5fd" font-family="monospace" font-size="13" text-anchor="middle" letter-spacing="3">CONTRIBUTIONS IN ORBIT</text>
</svg>
