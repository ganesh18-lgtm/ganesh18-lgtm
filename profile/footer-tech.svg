<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">Thanks for visiting</title>
  <desc id="desc">Animated technology-themed footer with flowing cyan and violet lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop stop-color="#08111c"/>
      <stop offset=".5" stop-color="#17133a"/>
      <stop offset="1" stop-color="#071c29"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" x2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="150" rx="18" fill="url(#bg)"/>
  <path d="M-20 112C180 20 320 145 510 74S860 12 1220 92" fill="none" stroke="url(#flow)" stroke-width="2" opacity=".8">
    <animate attributeName="stroke-dasharray" values="1 42;42 1;1 42" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="0;-180;-360" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M-20 132C210 55 350 165 560 100S900 40 1220 115" fill="none" stroke="#67e8f9" stroke-opacity=".3"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="66" fill="#f8fafc" font-size="27" font-weight="800" letter-spacing="3">THANKS FOR VISITING</text>
    <text x="600" y="94" fill="#a5b4fc" font-family="monospace" font-size="12" letter-spacing="3">KEEP BUILDING · KEEP EXPLORING · KEEP SHIPPING</text>
  </g>
  <circle cx="90" cy="52" r="3" fill="#22d3ee" filter="url(#glow)"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="1110" cy="46" r="3" fill="#a78bfa" filter="url(#glow)"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <rect x="1" y="1" width="1198" height="148" rx="18" fill="none" stroke="#334155"/>
</svg>
